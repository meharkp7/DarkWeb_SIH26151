[project]
name = "aegis-intelligence"
version = "0.1.0"
description = "Evidence-centric temporal multimodal threat-actor intelligence platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "numpy>=2,<3",
  "torch>=2.6,<3",
  "xgboost>=3.1,<4 ; sys_platform == 'darwin'",
  "xgboost-cpu>=3.1,<4 ; sys_platform != 'darwin'",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]
# Optional adapters, imported lazily by the code that needs them:
#   search -> aegis.search.opensearch.OpenSearchAdapter (opensearch-py)
#   s3     -> aegis.storage.s3.S3ObjectStore (boto3)
search = [
  "opensearch-py>=2,<3",
]
s3 = [
  "boto3>=1.34,<2",
]
report = [
  "reportlab>=4.2,<5",
]
telemetry = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running PostgreSQL (AEGIS_REQUIRE_DB=1 to fail instead of skip)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*", "torch", "torch.*", "reportlab", "reportlab.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
