name: CI

on:
  push:
  pull_request:

# Fork PRs get exactly this: read the repo, nothing else. No job below reads a
# secret, so nothing here needs write access or a token a fork cannot obtain.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      # ruff, mypy and pytest live in the `dev` *optional extra*, not a uv
      # dependency-group, so a bare `uv sync` would not install any of them.
      #
      # `search` and `s3` are installed too. They are optional at *runtime* —
      # the platform degrades when they are absent — but the adapters that
      # import them are ordinary source that mypy must check, and a job that
      # cannot resolve an import cannot typecheck the file that has it. CI is
      # the only place the extras are present, so this is the only place the
      # adapter code is verified at all.
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      - name: Ruff
        run: uv run ruff check src scripts tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: PYTHONPATH=src uv run pytest -q

  migrations:
    name: Migrations — empty database to head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      # The service container is empty, so this exercises every migration from
      # base. A migration that only applies to a database which already has the
      # object it alters fails here rather than against a developer's box.
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      # `upgrade head` exiting 0 only proves nothing raised; a migration that
      # never stamps alembic_version also exits clean. Compare the stamp.
      - name: Assert the database is stamped at head
        run: uv run python scripts/ci_check_alembic_head.py

  integration:
    name: Integration — app against a real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      # Without seed data the search and actor-register tests fail on
      # "the seeded dataset must produce at least one hit", so an unseeded
      # integration run measures nothing useful.
      - name: Seed the demonstration dataset
        run: PYTHONPATH=src uv run python scripts/seed_demo_data.py --reset --evidence-per-case 620
      # AEGIS_REQUIRE_DB=1 turns "PostgreSQL unreachable" from a skip into a
      # failure, so a wiring mistake cannot quietly reduce this run to nothing.
      - name: Pytest
        run: PYTHONPATH=src uv run pytest -q --junitxml=reports/pytest.xml
        env:
          AEGIS_REQUIRE_DB: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit
          path: reports/pytest.xml

  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-config:
    name: Deploy config parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      # Neither file is executed anywhere, so a syntax error in either would
      # otherwise only surface at deploy time on Render/Vercel.
      - name: render.yaml and vercel.json must parse
        run: uv run python scripts/ci_check_deploy_config.py

  schemas:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      - name: Canonical schema + ontology validation
        run: PYTHONPATH=src uv run python scripts/validate_schemas.py

  build:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      - run: uv build
      - name: Verify the built wheel imports
        run: uv run --with dist/*.whl python -c "import aegis; print('imported', aegis.__name__)"

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev --extra search --extra s3 --extra report --extra telemetry
      - name: Dependency vulnerability scan
        run: uv run python scripts/security_scan.py --deps
      - name: Secret scan
        run: uv run python scripts/security_scan.py --secrets
