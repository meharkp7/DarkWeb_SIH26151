name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy src

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Alembic migrations (schema comes only from alembic)
        run: uv run alembic upgrade head
      - name: "Pytest (Postgres service up: integration tests run, never skip)"
        run: PYTHONPATH=src uv run pytest -q --junitxml=reports/pytest.xml
        env:
          AEGIS_REQUIRE_DB: "1"
          # torch/xgboost segfault under BLAS thread oversubscription on some
          # runners. Pinned to 1 thread, matching docs/local-operations.md.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/pytest.xml

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Canonical schema + ontology validation
        run: PYTHONPATH=src uv run python scripts/validate_schemas.py
      - name: Alembic migration head check
        run: uv run alembic history | head -5

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Dependency vulnerability scan
        run: uv run python scripts/security_scan.py --deps
      - name: Secret scan
        run: uv run python scripts/security_scan.py --secrets
      - name: Security unit tests
        run: PYTHONPATH=src uv run pytest tests -q -k "security or injection or traversal"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv build
      - name: Verify wheel imports
        run: |
          uv run --with dist/*.whl python -c "import aegis; print(aegis.__name__)"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # Guard: the frontend is landing separately; skip (never fail) until
    # apps/frontend/package.json exists. The job stays in the workflow so
    # it runs the moment the package lands.
    if: ${{ hashFiles('apps/frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - run: npm run build
