repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.11, pydantic-settings>=2.10, sqlalchemy>=2.0]
        args: [src]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pytest
        name: unit tests
        entry: bash -c 'PYTHONPATH=src uv run pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
